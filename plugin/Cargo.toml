[package]
name = "neartect_plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_webview = { git = "https://github.com/httnn/nih-plug-webview", rev = "745d79a32fb21374758812e49436cb2a21e217fd" }
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
crossbeam-channel = "0.5"
rfd = "0.15"
base64 = "0.22"
raw-window-handle = "0.6"
raw-window-handle-05 = { package = "raw-window-handle", version = "0.5" }

[profile.release]
lto = "thin"
codegen-units = 1
