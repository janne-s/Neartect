<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neartect · Design the near space</title>
    <meta name="description" content="Neartect designs what a microphone's surroundings do to sound: walls, corners, recesses, gratings, and small spaces from centimetres to metres." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="src/shared/styles.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="src/neartect.css" />
    <script type="module" src="src/shared/app-reset.js"></script>
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <span class="brand">Near<span class="brand-suffix">tect</span></span>
      <button type="button" id="play" class="primary" aria-pressed="false" aria-keyshortcuts="Space">Play</button>
      <select id="signal" aria-label="Signal" title="Signal">
        <option value="pink">Pink noise</option>
        <option value="clicks">Clicks</option>
        <option value="sweep">Sweep</option>
        <option value="file" hidden>File</option>
      </select>
      <button type="button" class="icon-toggle" id="load-signal" aria-label="Load a sound file" title="Load a sound file"><i class="fa-solid fa-file-audio" aria-hidden="true"></i></button>
      <div class="icon-toggles" role="group" aria-label="Listening">
        <button type="button" class="icon-toggle" id="bypass" aria-pressed="false" aria-label="Free field" title="Free field"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="icon-toggle" id="undo" aria-label="Undo" title="Undo" aria-keyshortcuts="Meta+Z Control+Z" disabled><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
      <button type="button" id="open">Open</button>
      <button type="button" id="save">Save</button>
      <button type="button" id="export">Export</button>
      <input type="file" id="open-file" accept="application/json,.json" hidden />
      <input type="file" id="signal-file" accept="audio/*" hidden />
      <a class="github-link" href="https://github.com/janne-s/Neartect" target="_blank" rel="noopener noreferrer" aria-label="Neartect on GitHub" title="Neartect on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
      </a>
    </header>

    <main class="layout">
      <figure class="view" aria-label="Space">
        <canvas id="near-view" aria-label="Space"></canvas>
        <div class="view-side">
          <div class="icon-toggles view-tools" role="toolbar" aria-label="View" aria-orientation="vertical">
            <button type="button" class="icon-toggle" id="snap-surfaces" aria-pressed="false" aria-label="Snap to surfaces" title="Snap to surfaces"><i class="fa-solid fa-magnet" aria-hidden="true"></i></button>
            <button type="button" class="icon-toggle" id="view-reset" aria-label="Reset view" title="Reset view"><i class="fa-solid fa-crosshairs" aria-hidden="true"></i></button>
          </div>
          <div class="attribution">
            <button type="button" class="info-button" id="attribution-button" aria-expanded="false" aria-controls="attribution-text" title="Data sources">i</button>
            <div class="attribution-text" id="attribution-text" hidden></div>
          </div>
        </div>
        <div class="overlay overlay-corner">
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </figure>
      <div class="splitter splitter-column" id="split-column" role="separator" aria-orientation="vertical" aria-label="Resize parameters" tabindex="0"></div>
      <aside class="panel" aria-label="Parameters">
        <header class="sheet-header">
          <h2 id="sheet-title"></h2>
          <button type="button" id="sheet-close" class="primary">Done</button>
        </header>
        <section data-sheet="emitters">
          <h2><i class="fa-solid fa-cubes" aria-hidden="true"></i>Objects</h2>
          <div class="build-menu situations" id="situations" role="toolbar" aria-label="Start from a situation"></div>
          <div class="build-menu" id="build-menu" role="toolbar" aria-label="Add an object"></div>
          <div class="list" id="object-list"></div>
        </section>
        <section data-sheet="receivers">
          <h2><i class="fa-solid fa-microphone" aria-hidden="true"></i>Microphones</h2>
          <div class="list" id="microphone-list"></div>
          <div class="build-menu"><button type="button" class="build-button" id="add-microphone" title="Add a microphone" aria-label="Add a microphone"><i class="fa-solid fa-plus" aria-hidden="true"></i></button></div>
          <h2 class="subheading"><i class="fa-solid fa-volume-low" aria-hidden="true"></i>Source</h2>
          <div class="build-menu" id="source-kind" role="radiogroup" aria-label="Source">
            <button type="button" class="build-button" data-kind="far" role="radio" title="Far away: a plane wave from a direction" aria-label="Far away"><i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i></button>
            <button type="button" class="build-button" data-kind="point" role="radio" title="A point in the scene" aria-label="Point"><i class="fa-solid fa-circle-dot" aria-hidden="true"></i></button>
            <button type="button" class="build-button" id="source-distance" aria-pressed="true" title="Level falls with distance (1 m reference)" aria-label="Level falls with distance">1/r</button>
          </div>
          <div class="macros" id="source-macros"></div>
        </section>
        <details class="group" data-sheet="output">
          <summary><i class="fa-solid fa-volume-high" aria-hidden="true"></i>Air and output</summary>
          <div class="fields" id="output-fields"></div>
        </details>
      </aside>

      <div class="splitter splitter-row" id="split-row" role="separator" aria-orientation="horizontal" aria-label="Resize results" tabindex="0"></div>
      <section class="results" id="results" aria-label="Result">
        <figure class="plot plot-wave">
          <canvas id="impulse" aria-label="Near filter"></canvas>
          <figcaption>Near filter</figcaption>
        </figure>
        <figure class="plot plot-arrivals">
          <canvas id="response" aria-label="Frequency response"></canvas>
          <figcaption>Response · dB re free field</figcaption>
        </figure>
      </section>
      <nav class="sheet-tabs" aria-label="Panels">
        <button type="button" data-sheet="emitters" aria-label="Objects" title="Objects"><i class="fa-solid fa-cubes" aria-hidden="true"></i></button>
        <button type="button" data-sheet="receivers" aria-label="Microphones and source" title="Microphones and source"><i class="fa-solid fa-microphone" aria-hidden="true"></i></button>
        <button type="button" data-sheet="output" aria-label="Air and output" title="Air and output"><i class="fa-solid fa-volume-high" aria-hidden="true"></i></button>
        <button type="button" id="results-toggle" class="results-toggle" aria-expanded="false" aria-controls="results" aria-label="Plots" title="Plots"><i class="fa-solid fa-wave-square" aria-hidden="true"></i></button>
      </nav>
    </main>

    <dialog id="details" aria-labelledby="details-title" tabindex="-1">
      <header class="details-header">
        <h2 id="details-title"></h2>
        <span class="legend"><b>A</b> first principles · <b>B</b> literature · <b>C</b> heuristic or synthetic</span>
        <button type="button" id="details-close" class="primary">Done</button>
      </header>
      <div class="details-body" id="details-body"></div>
    </dialog>

    <dialog id="export-dialog" class="export-dialog" aria-labelledby="export-title" tabindex="-1">
      <form method="dialog">
        <header class="details-header">
          <h2 id="export-title">Export</h2>
        </header>
        <div class="export-body">
          <div class="export-choices">
            <button type="button" id="export-filter">Near filter WAV</button>
            <button type="button" id="export-processed">Filtered signal WAV</button>
          </div>
          <p class="export-summary" id="export-summary"></p>
          <p class="export-error" id="export-error" role="alert" hidden></p>
        </div>
        <footer class="export-actions">
          <button type="submit" value="cancel">Close</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
